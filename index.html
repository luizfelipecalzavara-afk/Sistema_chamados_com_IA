<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Chamados Inteligente com IA e Autorreparo — Diagnóstico automático, automações controladas e resolução inteligente de problemas de TI.">
  <title>ChamadoIA — Sistema de Chamados com Inteligência Artificial</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
  <!-- ========== Auth Layout ========== -->
  <div id="auth-layout" style="display: none; height: 100vh; align-items: center; justify-content: center; background: var(--bg-dark);">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🤖</div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">ChamadoIA</h1>
        <p style="color: var(--text-muted);" id="auth-subtitle">Faça login para continuar</p>
      </div>
      
      <div id="auth-form-container"></div>
    </div>
  </div>

  <div class="app-layout" id="app-layout" style="display: none;">
    <!-- ========== Sidebar ========== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">🤖</div>
          <div class="sidebar-logo-text">
            <h1>ChamadoIA</h1>
            <span>Suporte Autônomo</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Principal</div>
          <div class="nav-item active" data-page="dashboard">
            <span class="nav-item-icon">📊</span>
            <span>Dashboard</span>
          </div>
          <div class="nav-item" data-page="chamados">
            <span class="nav-item-icon">📋</span>
            <span>Chamados</span>
            <span class="nav-item-badge" id="badge-chamados">5</span>
          </div>
          <div class="nav-item" data-page="novo">
            <span class="nav-item-icon">➕</span>
            <span>Novo Chamado</span>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Suporte</div>
          <div class="nav-item" data-page="tecnico">
            <span class="nav-item-icon">🔧</span>
            <span>Painel do Técnico</span>
            <span class="nav-item-badge" id="badge-tecnico" style="background: var(--warning);">1</span>
          </div>
          <div class="nav-item" data-page="automacoes">
            <span class="nav-item-icon">⚙️</span>
            <span>Automações</span>
          </div>
        </div>

        <div class="nav-section" id="nav-section-admin" style="display: none;">
          <div class="nav-section-title">Administração</div>
          <div class="nav-item" data-page="admin">
            <span class="nav-item-icon">🛡️</span>
            <span>Painel Admin</span>
          </div>
          <div class="nav-item" data-page="admin-usuarios">
            <span class="nav-item-icon">👥</span>
            <span>Gerenciar Usuários</span>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Minha Conta</div>
          <div class="nav-item" data-page="perfil">
            <span class="nav-item-icon">👤</span>
            <span>Meu Perfil</span>
          </div>
          <div class="nav-item" onclick="App.logout()">
            <span class="nav-item-icon">🚪</span>
            <span>Sair</span>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">JS</div>
          <div class="user-info">
            <div class="user-name">João Silva</div>
            <div class="user-role">Usuário · Financeiro</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ========== Main Content ========== -->
    <main class="main-content">
      <!-- Header -->
      <header class="main-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h2 class="header-title" id="header-title">Dashboard</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" title="Notificações">
            🔔
            <span class="notification-dot"></span>
          </button>
          <button class="header-btn" title="Configurações">
            ⚙️
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content" id="page-content">
        <!-- Conteúdo renderizado dinamicamente pelo JS -->
        <div style="display: flex; align-items: center; justify-content: center; min-height: 400px;">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay"></div>

  <!-- Scripts (ordem importa!) -->
  <script src="js/data.js"></script>
  <script src="js/ia-engine.js"></script>
  <script src="js/automacoes.js"></script>
  <script src="js/components.js"></script>
  <script src="js/chamados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
